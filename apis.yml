name: Tangelo
description: >-
  Tangelo is a Latin American fintech company, surfaced in the API Evangelist
  network as a portfolio company of QED Investors (a fintech-focused venture
  firm). Tangelo runs an API-first developer program: it publishes API
  documentation through a Stoplight-hosted developer portal at
  docs.tangelolatam.com (workspace "Tangelo Latam Docs") and operates a branded
  Atlassian status page at status.tangelolatam.com. Its marketing site runs on
  Webflow. This profile was enriched by live probing of Tangelo's public
  surfaces; the underlying OpenAPI definition is served behind the Stoplight
  single-page app and was not machine-extractable in this pass, so spec-derived
  artifacts (packages, scopes, errors, authentication) remain open for a
  follow-up once the specification URL is captured.
